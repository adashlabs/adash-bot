services:
  adash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adash-bot
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ADASH_DB_PATH: /app/data/adash.db
    volumes:
      - adash-data:/app/data
    restart: unless-stopped
    init: true

volumes:
  adash-data:
