services:
  warp:
    image: caomingjun/warp:latest
    container_name: adash-warp
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE

    device_cgroup_rules:
      - "c 10:200 rwm"

    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1

    volumes:
      - warp-data:/var/lib/cloudflare-warp

  adash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adash-bot

    network_mode: "service:warp"

    depends_on:
      - warp

    env_file:
      - .env

    environment:
      ADASH_DB_PATH: /app/data/adash.db
      GOMEMLIMIT: 64MiB
      GOGC: "50"

    volumes:
      - adash-data:/app/data

    restart: unless-stopped
    mem_limit: 96m

volumes:
  adash-data:
  warp-data:
