services:
  adash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adash-bot
    env_file:
      - .env
    environment:
      ADASH_DB_PATH: /app/data/adash.db
      GOMEMLIMIT: 64MiB
      GOGC: "50"
    volumes:
      - adash-data:/app/data
    restart: unless-stopped
    mem_limit: 96m

volumes:
  adash-data:
