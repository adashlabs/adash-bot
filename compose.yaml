services:
  adash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adash-bot
    env_file:
      - .env
    environment:
      ADASH_DB_PATH: /app/data/adash.db
      GOMEMLIMIT: 64MiB
      GOGC: "50"
      HTTP_PROXY: "http://spoofdpi:8080"
      HTTPS_PROXY: "http://spoofdpi:8080"
      NO_PROXY: "localhost,127.0.0.1"
    volumes:
      - adash-data:/app/data
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      - spoofdpi

  spoofdpi:
    build:
      context: ./spoofdpi
    container_name: spoofdpi
    restart: unless-stopped
    command: ["--no-tui", "--listen-addr", "0.0.0.0:8080"]
    expose:
      - "8080"

volumes:
  adash-data:
